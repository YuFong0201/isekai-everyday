<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="./assets/favicon.ico">
  <title>今天也要前往異世界？！</title>
  
  <!-- Google 復古像素字型引入 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <!-- CSS 樣式檔引入 -->
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/setup.css">
  <link rel="stylesheet" href="./css/table.css">
  <link rel="stylesheet" href="./css/card.css">
  <link rel="stylesheet" href="./css/storybook.css">
  
  <!-- Three.js 3D 渲染庫 & GSAP 動畫引擎 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- 0. 瀏覽器音訊解鎖提示 overlay -->
    <div id="audio-start-overlay" class="audio-start-overlay">
      <div class="start-hint-box pixel-panel">
        <div class="logo-wrapper">
          <img src="./assets/今天也要前往異世界logo.png" alt="今天也要前往異世界?!" class="game-logo-img">
        </div>
        <!-- 🎯 去掉 emoji 並加入寬幅專屬 class -->
        <button id="btn-start-audio" class="pixel-start-btn btn-overlay-start">開始遊戲</button>
      </div>

      <footer class="start-screen-copyright">
        <a href="https://yufong0201.github.io/Support-Classroom/index.html" target="_blank" rel="noopener noreferrer">
          Copyright © 2026 奇老師的資源教室 All Rights Reserved.
        </a>
      </footer>
    </div>

    <!-- 1. 首頁設定畫面 (Setup View) -->
    <div id="setup-view" class="view active">
      <form id="setup-form" class="pixel-panel">
        
        <!-- Logo 標題區 -->
        <div class="logo-wrapper">
          <img src="./assets/今天也要前往異世界logo.png" alt="今天也要前往異世界?!" class="game-logo-img">
        </div>
        
        <!-- 人數 / 組數按鈕選擇器 (2~6) -->
        <div class="form-group">
          <label class="pixel-label">人數 / 組數：</label>
          <div id="player-count-btn-group" class="btn-group-selector">
            <button type="button" class="btn-count-opt pixel-btn" data-count="2">2</button>
            <button type="button" class="btn-count-opt pixel-btn" data-count="3">3</button>
            <button type="button" class="btn-count-opt pixel-btn active" data-count="4">4</button>
            <button type="button" class="btn-count-opt pixel-btn" data-count="5">5</button>
            <button type="button" class="btn-count-opt pixel-btn" data-count="6">6</button>
          </div>
          <input type="hidden" id="player-count" value="4">
        </div>

        <!-- 玩家 / 組別名稱 -->
        <div class="form-group">
          <label class="pixel-label">玩家 / 組別名稱：</label>
          <div id="player-names-container" class="player-input-grid"></div>
        </div>

        <!-- 故事主題牌組（自訂像素下拉選單） -->
        <div class="form-group">
          <label class="pixel-label">故事主題牌組：</label>
          <div class="pixel-custom-select-wrapper">
            <div id="pixel-deck-trigger" class="pixel-custom-select-trigger">
              <span id="pixel-deck-selected-text">載入中...</span>
              <span class="arrow-icon">▼</span>
            </div>
            <div id="pixel-deck-options" class="pixel-custom-select-options hidden"></div>
          </div>
          <input type="hidden" id="deck-select-value" value="">
        </div>

        <!-- 遊戲總計時滑塊 (Range Slider) -->
        <div class="form-group">
          <div class="slider-label-row">
            <label for="game-duration" class="pixel-label">遊戲總計時：</label>
            <span id="duration-val-display" class="pixel-badge">10 分鐘</span>
          </div>
          <input type="range" id="game-duration" class="duration-slider pixel-slider" min="1" max="30" value="10" step="1">
        </div>

        <!-- 置中進入遊戲大按鈕區塊（包含遊戲說明與進入遊戲） -->
        <div class="submit-btn-wrapper">
          <button type="button" id="btn-open-guide" class="btn-guide-trigger">
            📖 遊戲說明
          </button>
          <button type="submit" class="btn btn-primary btn-start-game pixel-start-btn">
            ⚔️ 進入遊戲 ⚔️
          </button>
        </div>
      </form>

      <!-- 🎯 首頁專屬左下角工具列：新牌組提供 / 回報錯誤 -->
      <div id="setup-left-controls" class="left-controls-bar">
        <a href="https://yufong0201.github.io/Support-Classroom/feedback.html" target="_blank" rel="noopener noreferrer" class="ctrl-btn ctrl-btn-text" title="新牌組提供 / 回報錯誤">
          <span class="btn-icon">💡</span>
          <span class="btn-text">新牌組提供 / 回報錯誤</span>
        </a>
      </div>
    </div>

    <!-- 2. Three.js 3D 牌桌畫面 (Table View) -->
    <div id="table-view" class="view">
      <canvas id="three-canvas"></canvas>

      <header class="game-header">
        <div id="timer-display">⏱ 剩餘時間: 10:00</div>
        <div id="drawn-cards"></div>
        <div id="current-player-banner">輪到玩家：<span id="active-player-name">--</span></div>
      </header>

      <div id="draw-trigger-container" class="draw-trigger-box hidden">
        <button id="draw-card-btn" class="btn-draw-main">召喚卡牌</button>
      </div>
    </div>

    <!-- 3. 華麗頒獎典禮與遊戲結算畫面 (Result View) -->
    <div id="result-view" class="view">
      <div class="result-card-container">
        <h1 class="result-title">🏆 本局排名 🏆</h1>
        
        <div id="podium-container" class="podium-stage"></div>

        <div class="result-actions">
          <button id="btn-result-print" class="btn btn-primary">🗐 列印故事書</button>
          <button id="btn-result-replay" class="btn btn-secondary">⟳ 重玩一次</button>
          <button id="btn-result-menu" class="btn btn-outline">🏠︎ 回主選單</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 4. 中央滿版選牌 Modal & 景深 Blur Overlay 容器 -->
  <div id="card-stage" class="card-modal-overlay hidden">
    <div class="card-stage-content">
      
      <div id="selection-timer-box" class="timer-box hidden">
        <svg class="timer-svg" viewBox="0 0 100 100">
          <circle class="timer-circle-bg" cx="50" cy="50" r="42"></circle>
          <circle id="timer-progress" class="timer-circle-progress" cx="50" cy="50" r="42"></circle>
        </svg>
        <span id="timer-count-num">20</span>
      </div>

      <h3 id="stage-title">✨ 請選擇一張卡牌展開故事：</h3>
      
      <div class="cards-row"></div>
      
      <div id="judge-actions" class="judge-actions-box hidden">
        <button id="btn-judge-good" class="btn-judge btn-good">👍 說得好！ (+1分)</button>
        <button id="btn-judge-fail" class="btn-judge btn-fail">👎 不行... (放回重抽)</button>
      </div>

      <aside id="modal-story-recorder" class="story-recorder-modal hidden">
        <h4>📝 故事記錄員</h4>
        <textarea id="story-input" placeholder="請在此處即時紀錄玩家發揮的創意故事..."></textarea>
      </aside>
    </div>
  </div>

  <!-- 5. 靠右側邊欄顯示：唯讀「瀏覽故事記錄」視窗 -->
  <aside id="story-history-sidebar" class="story-history-sidebar hidden">
    <div class="pixel-panel story-history-content">
      <h3 class="pixel-label" style="font-size: 16px; text-align: center; margin-bottom: 12px;">📖 冒險故事歷程記錄</h3>
      <div id="story-history-list" class="story-history-list"></div>
    </div>
  </aside>

  <!-- 6. 通用像素風格二選一確認彈窗 (Confirm Modal) -->
  <div id="pixel-confirm-modal" class="card-modal-overlay hidden">
    <div class="pixel-panel confirm-dialog-box">
      <h3 id="confirm-modal-title" class="pixel-label confirm-title">提示</h3>
      <p id="confirm-modal-msg" class="confirm-msg">是否確定執行此操作？</p>
      <div class="confirm-actions">
        <button id="btn-confirm-yes" class="pixel-btn confirm-btn yes">確定</button>
        <button id="btn-confirm-no" class="pixel-btn confirm-btn no">取消</button>
      </div>
    </div>
  </div>

  <!-- 7. 像素風格頭像選擇彈窗 (Avatar Picker Modal) -->
  <div id="avatar-picker-modal" class="card-modal-overlay hidden">
    <div class="pixel-panel avatar-picker-box">
      <h3 class="pixel-label confirm-title">選擇玩家頭像</h3>
      <div id="avatar-picker-grid" class="avatar-picker-grid"></div>
      <div style="margin-top: 16px; text-align: center;">
        <button id="btn-close-avatar-picker" class="pixel-btn confirm-btn no" style="padding: 6px 20px;">關閉</button>
      </div>
    </div>
  </div>

  <!-- 8. 遊戲內左下角控制工具列 (回選單/直接結算，遊戲中才會顯示) -->
  <div id="left-controls-bar" class="left-controls-bar hidden">
    <button id="btn-quick-menu" class="ctrl-btn ctrl-btn-text" title="返回首頁選單">
      <span class="btn-icon">🏠</span>
      <span class="btn-text">回選單</span>
    </button>
    <button id="btn-quick-finish" class="ctrl-btn ctrl-btn-text" title="直接進行分數結算">
      <span class="btn-icon">🏆</span>
      <span class="btn-text">直接結算</span>
    </button>
  </div>

  <!-- 9. 右下角全域控制項 (音量滑塊/靜音/全螢幕/瀏覽故事記錄) -->
  <div class="global-controls-bar">
    <button id="btn-view-story-history" class="ctrl-btn ctrl-btn-text hidden" title="查看暫存故事">
      <span class="btn-icon">📜</span>
      <span class="btn-text">瀏覽故事記錄</span>
    </button>
    <div class="volume-control-box">
      <button id="btn-mute-toggle" class="ctrl-btn" title="靜音/取消靜音">
        <span class="btn-icon" id="mute-icon">🔊</span>
      </button>
      <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="0.2">
    </div>
    <button id="btn-fullscreen-toggle" class="ctrl-btn ctrl-btn-text" title="全螢幕切換">
      <span class="btn-icon">⛶</span>
      <span class="btn-text">全螢幕</span>
    </button>
  </div>

  <!-- ES6 主邏輯進入點 -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
